name: Publish Core Alpha

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact @elizaos/core version to publish"
        required: true
        type: string

concurrency:
  group: publish-core-alpha-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "23.3.0"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify requested version matches package version
        run: |
          PACKAGE_VERSION=$(jq -r '.version' packages/typescript/package.json)
          if [[ "${PACKAGE_VERSION}" != "${{ inputs.version }}" ]]; then
            echo "Expected packages/typescript/package.json to be ${{ inputs.version }}, got ${PACKAGE_VERSION}"
            exit 1
          fi

      - name: Verify version is not already published
        run: |
          if npm view "@elizaos/core@${{ inputs.version }}" version >/dev/null 2>&1; then
            echo "@elizaos/core@${{ inputs.version }} is already published"
            exit 1
          fi

      - name: Typecheck core
        run: cd packages/typescript && bun run typecheck

      - name: Build core
        run: cd packages/typescript && bun run build

      - name: Test core
        run: cd packages/typescript && bun run test

      - name: Publish core with alpha tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: cd packages/typescript && npm publish --tag alpha --access public
